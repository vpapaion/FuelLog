name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Find and unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -iname "*.zip" | head -n 1)
          echo "Found ZIP: $ZIP_FILE"
          unzip "$ZIP_FILE" -d project

      - name: Show unzipped files
        run: find project -maxdepth 3 -type f | head -50

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -name gradlew | head -n 1)
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle permission
        run: chmod +x "$GRADLEW"

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FuelLoggerSimple-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
